# Workspace root, and the umbrella distribution that pulls the whole system in.
#
# `pip install totalsync` gets acquisition and analysis together; the three members are
# also independently installable, so a machine that only decodes recordings can take
# `totalsync-utils` on its own without pyserial, pyzmq or tkinter.
[project]
name = "totalsync"
version = "0.3.0"
description = "Teensy-based synchronization system for multi-modal neuroscience recordings"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Ronny Eichler" },
    { name = "Francesco P. Battaglia" },
    { name = "Morgane Audrain", email = "morganeaudrain@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
# Lower bounds, not just names: this distribution's [project.scripts] point into modules
# that only exist from these versions on -- totalsync-firmware needs
# totalsync_utils.firmware, new in 0.3. Without them a resolver is free to pair this
# umbrella with an older member and produce commands that die on import.
dependencies = [
    "totalsync-webinterface>=0.1.2",
    "totalsync-utils>=0.3",
    "totalsync-2p>=0.1.3",
]

# Forwarded so that `totalsync[extras]` and `uv sync --extra extras` keep working from
# the workspace root; the optional dependencies themselves belong to the member that
# imports them.
[project.optional-dependencies]
extras = ["totalsync-webinterface[extras]"]

# Re-declared here so that `uv tool install totalsync` puts all six commands on the
# PATH in one isolated environment, which is what a recording or analysis machine wants.
# A distribution that declares no executables of its own cannot be installed as a tool at
# all -- uv removes it again and tells you to name a member instead.
#
# These must stay in step with the [project.scripts] of the members that own the modules;
# `uv tool install` of this package is the check that they have.
[project.scripts]
totalsync = "totalsync_webinterface.teensy_commander:cli_entry"
totalsync-decode = "totalsync_utils.cli:main"
totalsync-pinsheet = "totalsync_utils.pinsheet:main"
totalsync-pinout = "totalsync_utils.pinout:main"
totalsync-firmware = "totalsync_utils.firmware:main"
totalsync-2p = "totalsync_2p.cli:main"

[project.urls]
Homepage = "https://github.com/NeuroNetMem/totalsync"
Repository = "https://github.com/NeuroNetMem/totalsync"
Documentation = "https://totalsync.readthedocs.io"
Issues = "https://github.com/NeuroNetMem/totalsync/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This distribution is metadata only: it has no Python of its own, so hatchling has to be
# told not to go looking for a package to put in the wheel.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
only-include = ["README.md", "LICENSE"]

[tool.uv.workspace]
# A glob, so a new package under packages/ joins the workspace by existing.
members = ["packages/*"]

# Without these, the three names above (and totalsync-2p's dependency on totalsync-utils)
# would be resolved from PyPI instead of from this tree.
[tool.uv.sources]
totalsync-webinterface = { workspace = true }
totalsync-utils = { workspace = true }
totalsync-2p = { workspace = true }

# Documentation build. `uv sync --group docs`, or see .readthedocs.yaml for how the
# published site is built.
[dependency-groups]
docs = [
    "sphinx>=8.1",
    "myst-parser>=4",
    "furo",
    "sphinx-copybutton",
    "sphinx-design",
]
