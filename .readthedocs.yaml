# ReadTheDocs build configuration. See docs/conf.py for the Sphinx side.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    # uv is supported natively here, so the site is built against the same uv.lock as
    # everything else, and `uv sync` brings in the workspace members that autodoc has to
    # import (totalsync_utils, totalsync_2p) along with the docs dependency group.
    - method: uv
      command: sync
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  # The build is warning-clean locally; keeping it that way is what catches a broken
  # cross-reference or a renamed docstring before it reaches the published site.
  fail_on_warning: true
