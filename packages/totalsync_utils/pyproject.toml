[project]
name = "totalsync-utils"
version = "0.2.0"
description = "TotalSync data decoding utilities"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Francesco P. Battaglia" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cobs",
    "numpy",
    "scipy",
    "tqdm",
    "pynapple",
    "pcpp",
    "matplotlib",
]

[project.scripts]
totalsync-decode = "totalsync_utils.cli:main"
totalsync-pinsheet = "totalsync_utils.pinsheet:main"
totalsync-pinout = "totalsync_utils.pinout:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["totalsync_utils"]
