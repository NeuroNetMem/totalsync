[project]
name = "totalsync-2p"
version = "0.1.3"
description = "TotalSync 2-photon data synchronization"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Francesco P. Battaglia" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pandas",
    "pynapple",
    "tifffile",
    "totalsync-utils",
    "tqdm",
]

[project.scripts]
totalsync-2p = "totalsync_2p.cli:main"

[project.urls]
Homepage = "https://github.com/NeuroNetMem/totalsync"
Repository = "https://github.com/NeuroNetMem/totalsync"
Documentation = "https://totalsync.readthedocs.io"
Issues = "https://github.com/NeuroNetMem/totalsync/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["totalsync_2p"]
